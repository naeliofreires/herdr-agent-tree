id = "naeliofreires.agent-tree"
name = "Agent Tree (cards need the custom app)"
version = "0.2.1"
min_herdr_version = "0.9.0"
description = "The Python plugin shows a text tree. The custom GPUI app adds workspace cards."
platforms = ["macos", "linux"]

[[startup]]
command = ["python3", "-m", "agent_tree", "event"]

[[actions]]
id = "setup"
title = "Show setup steps"
contexts = ["workspace"]
command = ["python3", "-m", "agent_tree", "setup"]

[[actions]]
id = "enable"
title = "Turn on"
contexts = ["workspace"]
command = ["python3", "-m", "agent_tree", "enable"]

[[actions]]
id = "sync"
title = "Update tree"
contexts = ["workspace"]
command = ["python3", "-m", "agent_tree", "sync"]

[[actions]]
id = "disable"
title = "Turn off"
contexts = ["workspace"]
command = ["python3", "-m", "agent_tree", "disable"]

[[actions]]
id = "list"
title = "Show links"
contexts = ["workspace"]
command = ["python3", "-m", "agent_tree", "list"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "-m", "agent_tree", "event"]

[[events]]
on = "pane.closed"
command = ["python3", "-m", "agent_tree", "event"]

[[events]]
on = "pane.moved"
command = ["python3", "-m", "agent_tree", "event"]

[[events]]
on = "tab.moved"
command = ["python3", "-m", "agent_tree", "event"]

[[events]]
on = "workspace.reordered"
command = ["python3", "-m", "agent_tree", "event"]
